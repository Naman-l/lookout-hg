# Grade sheets: the soft checks the Reviewer answers, per kind of item. Each is PASS or FAIL with a one-line critique when it fails: no middle
# score, because "partly" was used both for "met" and "not met" and the grades did not agree with a buyer's. The hard checks (numbers, owners,
# recipients, dates, required evidence) are the verifier's and are code. `critical: true` means a fail also sends Lookout back once in inline mode.
common:
  - name: answers the buyer's question
    asks: >-
      PASS only if the finding says, in plain words a buyer would use: what happened; what it means for Halden where it means something (a robot, a month, money or a date);
      and what to do next, or says plainly that nothing is needed. What to do next may be in the finding or in the next step (on a case, the finding is
      only the situation and the next step carries the action). FAIL if what happened or what to do next is missing from both or only implied.
  - name: assumptions are really assumptions
    asks: >-
      An assumption is something NOT known that the answer relied on (for example "stock on hand is zero because no count is loaded"). PASS only if every listed assumption is
      such a thing and nothing the answer states as certain is actually unknown. FAIL if an assumption restates a known fact (importer of record, "as the orders show", "nothing is
      staged", a date the notice gave) or if an unknown is written as a fact (stock is zero, origin is China, a supplier is acknowledged).
  - name: nothing in it commits Halden
    critical: true
    asks: >-
      PASS only if nothing in the finding, the open questions or any drafted request commits Halden: no award, no promise, no agreed price or quantity, no change to an order, no
      payment, no bank detail. Asking a supplier for information or a confirmation is fine. FAIL on any commitment.
  - name: what would change it is specific
    asks: >-
      PASS only if every "would change" line names something a person can check: a document, a date, a number, or a named person's answer. FAIL if any line is a generality
      ("more information", "if conditions change", "once confirmed").
  - name: buyer's words
    asks: >-
      PASS only if the text is in the buyer's world (suppliers, orders, parts, robots, people by name) and uses none of: alias, analyst, specialist, handoff, verifier, normaliser,
      qty_received or any field or table name, a teammate's title (the clerk, the planner), purchase_orders export, "the tool", an id that stands in for a name (SUP-0001, V10233), a run id, JSON. Part numbers, PO numbers and
      quote numbers are fine. FAIL if any appears.
disruption:
  - name: names the robot and the month
    asks: PASS only if it says which robot builds are hit and from which month, and asks the supplier for revised dates and allocation. FAIL otherwise.
risk:
  - name: names the supplier's position and what only it supplies
    asks: >-
      PASS only if the answer (finding, what it picked out, next step) says what puts the supplier at risk, which part only it supplies and the robot it feeds,
      and its terms where the records give them (prepayment, price against what was paid last), and never advises paying ahead. FAIL otherwise.
incident:
  - name: says what moved and asks for the dates to be confirmed
    asks: >-
      PASS only if it names the robot builds the moved lines feed, says which lines moved or are late and to when, and the next step or the request
      asks the supplier to confirm the new dates hold. It must not ask for allocation or mention stock that survived: nothing burned. FAIL otherwise.
tariff:
  - name: what is owed, the most it could be, and who pays
    asks: >-
      PASS only if the answer (finding, what it picked out, next step) leads with the duty owed, says the most it could be or what is owed only if orders ship late,
      and says who is importer of record and which lines enter in time. The words "net", "gross" and "conditional" are not required. FAIL otherwise.
unknown:
  - name: names the unknown, its owner and the question
    asks: PASS only if it says exactly what is unknown, why it blocks the answer, who owns it and what to ask, without filling the blank in. FAIL otherwise.
deadline:
  - name: says what the date protects
    asks: PASS only if it says what is lost if the date passes and the action to take before it. FAIL otherwise.
compare:
  - name: conditions stay with the value
    asks: PASS only if lead-time conditions, validity, Incoterm and origin-to-confirm are kept beside each price and no award is recommended. FAIL otherwise.
import:
  - name: says what the file is and what the step does
    asks: PASS only if it says what the file is, how it differs from the known export, and what the proposed step changes. FAIL otherwise.
  - name: findings carry count, consequence and example
    asks: PASS only if each finding states how many rows, what it would cost if left alone, and a real example. FAIL otherwise.
  - name: questions are specific and few
    asks: PASS only if the questions are things only a person can decide, grouped (not per row), each with a proposed answer, and nothing is guessed. FAIL otherwise.
