        origin:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin
        lead_time:
          anyOf:
          - $ref: '#/components/schemas/Conditional'
          - type: 'null'
        valid_until:
          anyOf:
          - type: string
          - type: 'null'
          title: Valid Until
        days_left:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days Left
        expired:
          type: boolean
          title: Expired
        moq:
          anyOf:
          - type: integer
          - type: 'null'
          title: Moq
        tooling_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Tooling Usd
        payment_terms:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Terms
        conditions:
