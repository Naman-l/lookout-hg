        duty_if_china_usd:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        tooling_per_unit_usd:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        total_known_usd:
          $ref: '#/components/schemas/Money'
        total_if_china_usd:
          anyOf:
          - $ref: '#/components/schemas/Money'
