openapi: 3.1.0
info:
  title: Lookout
  description: 'A procurement workspace: a system of record and a system of action'
  version: 0.1.0
paths:
  /api/health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Api Health Get
  /api/data-issues:
    get:
      summary: Defects found in the company's files and how each was handled
      operationId: data_issues_api_data_issues_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DataIssue'
                type: array
                title: Response Data Issues Api Data Issues Get
  /api/data/steps:
    get:
      summary: The recipe's steps in the order they ran, with rows in and out
      operationId: steps_api_data_steps_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BuildStep'
                type: array
                title: Response Steps Api Data Steps Get
  /api/data/stamp:
    get:
      summary: When the database was built, from which recipe, and the gate result
      operationId: stamp_api_data_stamp_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildStamp'
  /api/imports/questions:
    get:
      summary: The current import's questions as a short deck (grouped entries, a proposed answer each)
      operationId: questions_api_imports_questions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDeck'
  /api/imports/answers:
    post:
      summary: Accept, change or skip questions (one or many)
      operationId: answers_api_imports_answers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportAnswers'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDeck'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/imports/dry-run:
    get:
      summary: The recipe run on a copy with the current answers; before and after per file, the load checks
      operationId: dry_run_api_imports_dry_run_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDryRun'
  /api/imports/approve:
    post:
      summary: Load what the dry run showed. Refused if the answers changed since that dry run.
      operationId: approve_api_imports_approve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportApproval'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportLoaded'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/people:
    get:
      summary: 'The buyers: who they are, what they buy, what is open on their desk'
      operationId: people_api_people_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Person'
                type: array
                title: Response People Api People Get
  /api/counts:
    get:
      summary: Live counts for the sidebar
      operationId: counts_api_counts_get
      parameters:
      - name: buyer
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Buyer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counts'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/action-items:
    get:
      summary: 'Today: one row per cause, ranked by code'
      description: 'Filters: `owner` (a member''s id or name: their share of each case they own), `tab`, `vertical`, `project` (id or any alias), `waiting_on`,

        and an act-by window (ISO dates; a case with no date is outside a window).'
      operationId: action_items_api_action_items_get
      parameters:
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      - name: tab
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tab
      - name: vertical
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Vertical
      - name: project
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project
      - name: waiting_on
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Waiting On
      - name: act_by_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Act By From
      - name: act_by_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Act By To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionItem'
                title: Response Action Items Api Action Items Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/action-items/{key}/routes:
    get:
      summary: The case's routes, from the code table, with their figures
      operationId: action_item_routes_api_action_items__key__routes_get
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
                title: Response Action Item Routes Api Action Items  Key  Routes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/action-items/{key}/runs:
    get:
      summary: The runs on one case, newest first
      operationId: action_item_runs_api_action_items__key__runs_get
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - runs
      summary: 'Work a case: replayed from its recording where one exists, else drafted by code (no model is connected)'
      operationId: start_run_api_action_items__key__runs_post
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/StartRun'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/action-items/{key}:
    get:
      summary: 'One case in full: its evidence, findings, panels and history'
      operationId: action_item_api_action_items__key__get
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItemDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/actions:
    get:
      tags:
      - approvals
      summary: List Actions
      description: 'The drafts, newest first; `item_key` keeps the drafts of one Action list item and `run_id` those of one run (both exact); `chosen=true` only the

        drafts whose route the buyer chose.'
      operationId: listActions
      parameters:
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - proposed
            - signed
            - approved
            - rejected
            - executed
            type: string
          - type: 'null'
          title: State
      - name: item_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Item Key
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
      - name: chosen
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Chosen
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
                title: Response Listactions
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/actions/{action_id}:
    get:
      tags:
      - approvals
      summary: Get Action
      operationId: getAction
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - approvals
      summary: Edit Action
      description: Change the subject and text of a draft still waiting. The payload hash changes, so the buyer approves the edited text, not the old one. 409 once
        decided.
      operationId: editAction
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditDraft'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/actions/{action_id}/approve:
    post:
      tags:
      - approvals
      summary: Approve
      description: Approve exactly what was shown, then execute (simulated send). 409 on a stale hash or a non-proposed state.
      operationId: approveAction
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Approve'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/actions/{action_id}/reject:
    post:
      tags:
      - approvals
      summary: Reject
      operationId: rejectAction
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reject'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/action-items/{key}/actions:
    post:
      tags:
      - approvals
      summary: Stage Case Action
      description: 'Stage a note, a decision or an ERP update on a case for its owner''s signature (F101: Approvals hold everything that needs a signature).

        Only an owner of the case may stage it, and only that person may approve it. Never on a trust item: nothing is acted on from a message that failed the checks.'
      operationId: stageCaseAction
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageAction'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/action-items/{key}/routes/{kind}/choose:
    post:
      tags:
      - approvals
      summary: Choose Route
      description: 'The buyer chooses a route on a case (the main one, or each "Also start"): the choice is recorded with who and when, and its draft is returned:

        the one the morning run prepared for that route, or one drafted now in code from the route''s template, to its recipient on file. Owner only; no model;

        nothing is sent until the owner approves the draft.'
      operationId: chooseRoute
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: kind
        in: path
        required: true
        schema:
          type: string
          title: Kind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChooseRoute'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/action-items/{key}/controls:
    post:
      tags:
      - approvals
      summary: Record Held Control
      description: 'A held message''s required action, done: recorded on the case at once with who and when (BUYER 02: ticks kept only in the browser were gone in
        a

        new tab). Nothing is staged or sent; the record is append-only, so a done control stays done.'
      operationId: recordHeldControl
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeldControl'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/outbox:
    get:
      tags:
      - approvals
      summary: Outbox
      operationId: listOutbox
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OutboxMessage'
                type: array
                title: Response Listoutbox
  /api/messages:
    get:
      summary: The shared inbox, newest first; trust computed before anyone reads; q searches sender, company, subject, facts, PR/PO numbers and body
      operationId: messages_api_messages_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
      - name: trust
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Trust
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageSummary'
                title: Response Messages Api Messages Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/messages/{message_id}:
    get:
      summary: 'One message as quoted data: trust, what it means, the dates it carries, the lines it moves, the case it feeds'
      operationId: message_api_messages__message_id__get
      parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: string
          title: Message Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/annotate:
    post:
      summary: What a text mentions, matched against the records (projects, plants, materials, vendors, people, PRs, POs, rupees, dates, quantities); offsets are
        UTF-16 indices
      operationId: annotateText
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Annotate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Span'
                type: array
                title: Response Annotatetext
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/search:
    get:
      summary: Search across action items, messages, suppliers (names, former names, domains), parts (number, name), PO lines (the full number and the short 'PO 450/10'
        form are both found) and people; deterministic, no model
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Q
      - name: types
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'comma-separated: item, message, supplier, part, po_line, person'
          title: Types
        description: 'comma-separated: item, message, supplier, part, po_line, person'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hit'
                title: Response Search
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/vendors:
    get:
      summary: 'Vendors: one row per company (codes linked, never merged), library verticals, on-time share, open POs'
      operationId: vendors_api_vendors_get
      parameters:
      - name: in_library
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: In Library
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VendorRow'
                title: Response Vendors Api Vendors Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/vendors/{vendor_id}:
    get:
      summary: 'One vendor: its codes, library rows, delivery record, MSME dues, guarantees, POs, quotes and messages'
      operationId: vendor_api_vendors__vendor_id__get
      parameters:
      - name: vendor_id
        in: path
        required: true
        schema:
          type: string
          title: Vendor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/vendors/{vendor_id}/quotes:
    get:
      summary: Every quote on file from one vendor (tracker and mail), newest first, with its CS, material, project and the CS outcome
      operationId: vendor_quotes_api_vendors__vendor_id__quotes_get
      parameters:
      - name: vendor_id
        in: path
        required: true
        schema:
          type: string
          title: Vendor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VendorQuote'
                title: Response Vendor Quotes Api Vendors  Vendor Id  Quotes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/materials:
    get:
      summary: The material master with what is open and the last rate paid
      operationId: materials_api_materials_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MaterialRow'
                type: array
                title: Response Materials Api Materials Get
  /api/materials/{code}:
    get:
      summary: 'One material: rate history by site and vendor, where used, open PRs and POs, quotes against the last PO and the budget'
      operationId: material_api_materials__code__get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/prs:
    get:
      summary: PR lines (ME5A) with status, age, turnaround and plain-word flags
      operationId: prs_api_prs_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: buyer
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Buyer
      - name: project
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project
      - name: flag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Flag
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrLineView'
                title: Response Prs Api Prs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
