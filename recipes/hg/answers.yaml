# Decisions a person would answer on an Import card, for H.G. Infra's SCM data. The bootstrap answers were taken from the evidence named in each
# entry; who answered is recorded beside each. Code reads every customer fact from here or from data/, never from itself.
kind: bootstrap
# The data date and horizon: the day the exports were taken. LOOKOUT_AS_OF overrides it to rebuild as the data stood on an earlier day.
as_of: "2026-10-20"
company: "H.G. Infra Engineering Ltd."
company_short: "HG Infra"                # how the screens and letters say the company in short
base_currency: INR
internal_domain: hginfra.example        # mail from this domain is internal; a look-alike of it is held like a vendor look-alike
answered_by: "Sudeep Singh (MIS) with Satish Kumar Sharma (Head of SCM), 20 Oct 2026, from the files named in each entry"

# What each kind of id looks like in these records (regular expressions, no anchors). The agent layer reads them from the build.
id_shapes:
  pr: '10\d{8}'
  pr_line: '10\d{8}/\d{1,3}'
  po: '45\d{8}'
  po_line: '45\d{8}/\d{1,3}'
  mat_doc: '50\d{8}'
  vendor: '1\d{5}'
  material: '(?:1[1-5]|2[1]|3[12]|41)\d{6}'

# The files the recipe reads. stamp: header (the SAP list export's first line), name (the date in the file name), or none. A sheet is a snapshot:
# built after the data date, it is not read at all. A tracker (cut: rows) is a running record: it is read as of the data date row by row.
stale_after_days: 7
sources:
  me5a: {file: "sap/ME5A_purchase_requisitions.csv", kind: sap, stamp: header, title: "Purchase requisitions (ME5A)"}
  me2n: {file: "sap/ME2N_purchase_orders.csv", kind: sap, stamp: header, title: "Purchase orders (ME2N)"}
  mb51: {file: "sap/MB51_goods_receipts.csv", kind: sap, stamp: header, title: "Goods receipts (MB51)"}
  fbl1n: {file: "sap/FBL1N_vendor_line_items.csv", kind: sap, stamp: header, title: "Vendor line items (FBL1N)"}
  vendor_master: {file: "sap/vendor_master.csv", kind: sap, stamp: header, title: "Vendor master"}
  material_master: {file: "sap/material_master.csv", kind: sap, stamp: header, title: "Material master"}
  purchasing_groups: {file: "sap/purchasing_groups.csv", kind: reference, stamp: header, title: "Purchasing groups"}
  project_directory: {file: "sheets/Project Directory.csv", kind: reference, stamp: none, title: "Project directory"}
  roads_req: {glob: "sheets/Roads Major Material Requirement*.csv", kind: sheet, stamp: name, layout: grid, title: "Roads 3-month material requirement"}
  railway_req: {glob: "sheets/Railway Material Quantity Summary*.csv", kind: sheet, stamp: name, layout: grid, title: "Railway 3-month material requirement"}
  fund: {glob: "sheets/SCM Fund Requirement *.csv", kind: sheet, stamp: name, layout: grid, many: true, title: "Fund requirement"}
  payment_projection: {glob: "sheets/Payment Projection*.csv", kind: sheet, stamp: name, skip: 2, title: "Payment projection"}
  lookahead: {glob: "sheets/Look Ahead Long Lead Items*.csv", kind: sheet, stamp: name, skip: 1, title: "Long-lead look-ahead"}
  vendor_library: {cut: rows, glob: "sheets/Vendor Library*.csv", kind: sheet, stamp: name, title: "Vendor library"}
  budget_rates: {file: "sheets/budget_rates.csv", kind: reference, stamp: none, title: "Budget rates"}
  doa: {file: "sheets/doa.csv", kind: reference, stamp: none, title: "Delegation of authority"}
  organogram: {file: "sheets/SCM Material Organogram.csv", kind: reference, stamp: none, layout: grid, title: "SCM organogram"}
  cs_tracker: {cut: rows, glob: "sheets/RFQ CS Tracker*.csv", kind: tracker, stamp: name, title: "RFQ and CS tracker"}
  expediting: {cut: rows, glob: "sheets/Expediting Tracker*.csv", kind: tracker, stamp: name, title: "Expediting tracker"}
  lc_bg: {cut: rows, glob: "sheets/LC BG Tracker*.csv", kind: tracker, stamp: name, title: "LC and BG tracker"}
  tat_report: {glob: "sheets/PR PO TAT Report*.csv", kind: sheet, stamp: name, skip: 1, title: "PR to PO turnaround report (MIS)"}
  commodity_index: {file: "external/commodity_index.csv", kind: external, stamp: header, skip: 1, title: "Commodity indices"}
  inbox: {glob: "inbox/*.eml", kind: inbox, stamp: none, title: "SCM shared inbox"}

