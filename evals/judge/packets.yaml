  item: A Halden procurement question (2026-09-02_Baycrest_Connectors_is_now_BCX_Interconnect_-_2027_quotation_BCX-Q-2609)
  recommendation:
    finding: Baycrest Connectors' message says the company was acquired and renamed BCX Interconnect, and it sends
      a 2027 quotation (BCX-Q-2609) with 11 priced lines. The sender address is not the contact on file for Baycrest,
      so the message is held for review. The rename is already linked in the supplier master, so there is nothing
      new to link. Do not move POs to the new orders address on this email alone.
    assumptions:
    - The existing link between BCX Interconnect and Baycrest in the master reflects the same rename the email describes.
    would_change:
    - Confirming the rename and the new orders address by phone with the contact on file would let the change be
      accepted.
    - A different bank, tax ID or remit-to in later mail would make this a payment-fraud risk.
    open_questions:
    - what: Whether the sender and the new orders address are genuine
      why_it_blocks: The sender is not the contact on file, so the address change and the 2027 prices cannot be
        accepted yet.
      owner: Dana
      question: Please phone the Baycrest contact on file to confirm the BCX Interconnect rename, the new orders
        address and that tax ID, bank and remit-to are unchanged.
      refs: []
    - what: Origin of the Dongguan-built lines in the 2027 quote
      why_it_blocks: The origin decides the duty, which changes the landed cost of the 2027 prices.
      owner: supplier
      question: Please confirm country of origin for each quoted line, especially the Dongguan-built ones.
      refs: []
    numbers: []
  checks:
  - name: answers the buyer's question
    asks: Does the finding say, in plain words a buyer would use, what happened, what it means for Halden and what
      to do next?
  - name: assumptions are assumptions
    asks: Is every listed assumption something not known, and is every known fact stated as fact, not as an assumption?
  - name: nothing is committed
    asks: Does any drafted or recommended step commit Halden (an award, a promise, a price agreed, a PO change)
      without a person's approval?
  - name: what would change the answer is specific
    asks: Does each "would change" line name something concrete (a document, a date, a number), not a generality?
  - name: buyer's words
    asks: Are suppliers and parts named the way a buyer says them, dates in words, and no ids, JSON or system terms
      in the prose?
