# Hindsight replay: build the records as the data stood on a given day, serve them with that day as "today", and ask the Action list
# whether it flags a thing the day its source arrives, and never earlier. No model and no key. The expected lists come from the dates in
# the raw files (data/quotes/<date>_*), written before the app was asked.
#   show:  Action items that must be on the list that day
#   hide:  items that must NOT be (their source has not arrived: showing one means the app read the future)
# Every cut also checks that no message or order in the records is dated after the cut.
fire_source: "data/quotes/2026-09-22_NOTICE_OF_FORCE_MAJEURE_-_Shenzhen_Yunzhan_Precision_Motor_Co_Ltd.eml"
tariff_source: "data/external/tariff_notice.md (dated 2026-09-18 in its header) and data/quotes/2026-09-18_Jadepeak_Customer_Notice_CN-2026-09.txt"
cuts:
  - as_of: 2026-09-10
    why: "before the spot offer, the tariff advisory, the Jadepeak and Yunzhan notices: only the quiet deadlines (a quote expiring, a price rise to beat, orders past due) and the news of a sole source's insolvency (09-10)"
    show: [deadline:SUP-0001:2026-10-13, deadline:SUP-0041:2026-10-15, deadline:chase, risk:SUP-0002]
    hide_groups: [tariff]
    hide: [disruption:SUP-0001, disruption:SUP-0013, trust:2026-09-12_Spot_offer_-_NG6603-QFN48_in_stock_ships_today, trust:2026-09-23_URGENT_Updated_remittance_details_following_plant_incident]
  - as_of: 2026-09-17
    why: "the injected spot offer (09-12) is on the list the day it can be read; nothing about the fire, the tariff or the fraud exists yet"
    show: [trust:2026-09-12_Spot_offer_-_NG6603-QFN48_in_stock_ships_today]
    hide_groups: [tariff]
    hide: [trust:2026-09-23_URGENT_Updated_remittance_details_following_plant_incident, disruption:SUP-0001, disruption:SUP-0013, tariff:all]
  - as_of: 2026-09-22
    why: "the Jadepeak notice and the tariff advisory (09-18) and the Yunzhan fire (09-22) are on the list; the 09-23 remittance mail is not"
    show: [disruption:SUP-0001, disruption:SUP-0013, tariff:all, unknown:origin]
    hide: [trust:2026-09-23_URGENT_Updated_remittance_details_following_plant_incident]
  - as_of: 2026-09-25
    why: "the whole month: the fraud mail (09-23) is held and the list is what the app shows today"
    show: [disruption:SUP-0001, disruption:SUP-0013, tariff:all, trust:2026-09-23_URGENT_Updated_remittance_details_following_plant_incident, trust:2026-09-12_Spot_offer_-_NG6603-QFN48_in_stock_ships_today]
    hide: []
