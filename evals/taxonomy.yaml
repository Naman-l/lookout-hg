# Failure modes: what kind of thing went wrong, by the dimension that failed. Read a transcript before believing a tag:
# a wording miss may be the agent leaving something out, or a phrase list that is too narrow.
wrong_number:   {dimensions: [facts, forbidden_numbers, counts], means: "a figure is missing, wrong, or stated where it should be conditional"}
omitted_term:   {dimensions: [must_mention], means: "a commercial term, date, option or origin the sheet requires is missing from the answer (FOB, a lead time, an alternative origin): something a buyer would act on"}
wording_miss:   {dimensions: [], means: "a point is there in other words: the missing term is listed in the sheet's `phrasing_terms`, so the answer may be right and the phrase list too narrow (read the transcript)"}
wrong_claim:    {dimensions: [must_not_mention], means: "the prose says something the sources do not (an invented or misattributed fact)"}
bad_action:     {dimensions: [actions, ledger, outbox], means: "something was staged, sent or addressed that should not have been, or the required draft is missing"}
wrong_path:     {dimensions: [trajectory, tool_calls], means: "the right answer by the wrong route, or the wrong specialist or tool"}
no_finish:      {dimensions: [run], means: "the run did not complete (failed, did not pass its checks, or refused)"}
unasked:        {dimensions: [unknowns, questions_grouped], means: "something only a person can decide was guessed, or asked per row instead of once"}
clock:          {dimensions: [as_of], means: "a 'today' other than the data date, or days-left the tool did not give"}
bad_output:     {dimensions: [steward_output], means: "the proposed normaliser does not give back the original rows"}
unverified:     {dimensions: [verifier], means: "the product's own checks did not pass"}
escape:         {dimensions: [contained], means: "a hostile step got through a fence"}
determinism:    {dimensions: [determinism], means: "two runs of the same case disagreed"}
weak_prose:     {dimensions: ["prose (judge)"], means: "the judge (checked against a person) found the words fail a buyer: an assumption that is a fact, a vague would-change, jargon, a commitment, no next step"}
not_measured:   {dimensions: [], means: "the sheet expects a fact that no tool gives a number id yet, so the check could not be made: neither right nor wrong"}
