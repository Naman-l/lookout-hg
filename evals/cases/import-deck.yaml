id: import-deck
core: true            # part of THE answer sheet: written from the raw files before any agent ran
category: ordinary
kind: api                 # the import conversation as code: questions come from the recipe's own decisions; no model
item_key: null
checks:
  - id: deck-has-six-cards
    get: /api/imports/questions
    rows: questions
    pick: {id: "alias:legacy-ids"}
    expect: {kind: alias, covers: 10, state: open, entries: [V10019, V10045, V10077, V10114, V10233, V10302, V10388, V10410, V10560, V10871]}
  - id: rename-is-its-own-question
    get: /api/imports/questions
    rows: questions
    pick: {id: "alias:rename"}
    expect: {covers: 1, entries: [SUP-0061]}
  - id: nine-blank-currencies-all-closed-or-cancelled
    get: /api/imports/questions
    rows: questions
    pick: {id: "currency:blank"}
    expect: {covers: 9, entries: ["HPO-25-00014/10", "HPO-25-00130/10", "HPO-25-00211/90", "HPO-25-00612/20", "HPO-25-00638/40", "HPO-26-00408/230", "HPO-26-00415/40", "HPO-26-00472/10", "HPO-26-00491/170"]}
  - id: five-unknown-origins-left-to-the-buyer
    get: /api/imports/questions
    rows: questions
    pick: {id: "origin:unknown-on-listed-codes"}
    expect: {covers: 5, entries: [HR-13103, HR-21106, HR-40220, HR-40320, HR-51130], proposed.answer: "Leave unknown, ask the buyer"}
  - id: six-repeated-rows
    get: /api/imports/questions
    rows: questions
    pick: {id: "duplicate-row:po"}
    expect: {covers: 6, entries: ["PO-10624/2", "PO-10626/10", "PO-10690/2", "HPO-25-00120/150", "HPO-25-00251/10", "HPO-25-00251/60"]}
  - id: three-possible-duplicate-parts
    get: /api/imports/questions
    rows: questions
    pick: {id: "possible-duplicate:parts"}
    expect: {covers: 3, entries: ["HR-20103 = HR-20146", "HR-32101 = HR-32142", "HR-42120 = HR-42121"]}
  - id: corvell-look-alikes-are-not-asked-about
    get: /api/imports/questions
    rows: questions
    pick: {id: "alias:legacy-ids"}
    expect: {entries: [V10019, V10045, V10077, V10114, V10233, V10302, V10388, V10410, V10560, V10871]}    # no SUP-0036 / SUP-0037 / SUP-0017 among them
  - id: no-stock-count-so-nothing-is-called-covered
    get: /api/imports/questions
    rows: questions
    pick: {id: "stock:count"}
    expect: {kind: stock_count, covers: 335, state: open}   # 481 bought parts (not Finished Good, not Sub-assembly) minus those with open, non-stale supply; the data holds no stock levels
  - id: dry-run-purchase-orders
    get: /api/imports/dry-run
    rows: files
    pick: {file: purchase_orders.csv}
    expect: {rows_in: 2622, rows_out: 2616}
  - id: dry-run-bom-drops-the-repeated-row
    get: /api/imports/dry-run
    rows: files
    pick: {file: bom.csv}
    expect: {rows_in: 359, rows_out: 358}
  - id: dry-run-nothing-else-lost
    get: /api/imports/dry-run
    rows: files
    pick: {file: suppliers.csv}
    expect: {rows_in: 71, rows_out: 71}
  - id: dry-run-gate-all-green
    get: /api/imports/dry-run
    expect: {checks: {all_true: passed}, answers.total: 7, answers.changed: 0}
reason: "The no-model half of the Data steward: every question the import asks is a decision the recipe already takes, grouped so one answer settles many, with the proposed answer on the card. Derived from the raw files independently (tests re-derive each list), including what must not be asked: Corvell's two look-alike suppliers."
oracle: "bootstrap recipe decisions; independent derivation in evals/tests/test_new_keys.py"
source: "data/suppliers.csv (V-prefixed legacy records; SUP-0061); data/purchase_orders.csv (empty currency; exact repeated rows); data/parts.csv (blank country_of_origin on tariff codes; shared manufacturer and MPN); data/bom.csv (HR-80240 > HR-15109 twice, find_no 260)"
