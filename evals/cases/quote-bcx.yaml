id: quote-bcx
category: hard
kind: agent
start: {post: /api/parts/HR-20103/compare-runs}
item_key: null          # bound to the Compare quotes workflow on the part (GET /api/parts/{part}/compare), not to an Action-list item: the BCX quote is valid to 2026-11-30, outside the deadline window by design
expected:
  facts:
    - {name: unit_price_usd_each, id: "quote:HR-20103:BCX-Q-2609:price_quoted", part: HR-20103, value: 0.24058, tolerance: 0.001, source_table: messages}   # 240.58 per 1,000, not 240.58 each
    - {name: unit_price_usd_each, id: "quote:HR-20104:BCX-Q-2609:price", part: HR-20104, value: 0.28543, tolerance: 0.001}
    - {name: unit_price_usd_each, id: "quote:HR-20140:BCX-Q-2609:price", part: HR-20140, value: 1.53693, tolerance: 0.001}
    - {name: unit_price_usd_each, id: "quote:HR-20136:BCX-Q-2609:price", part: HR-20136, value: 9.10, tolerance: 0.001}                              # quoted each
    - {name: price_vs_last_po_pct, part: HR-20103, value: 6.7, tolerance: 0.05}                               # vs 0.2254 (HPO-26-00070)
    - {name: duty_2027_usd, id: "quote:BCX-Q-2609:duty_next_12_months", value: 8838, tolerance: 0.01}                                                    # est. annual qty x price x 15% on the six tranche-2 China lines, from 2027-01-01
    - {name: duty_2027_usd, id: "quote:HR-20136:BCX-Q-2609:duty_next_12_months", part: HR-20136, value: 5733, tolerance: 0.01}
  duty_scope:
    dutiable_china_lines: [HR-20103, HR-20104, HR-20110, HR-20111, HR-20136, HR-20137]    # 8536.69, China (Dongguan), tranche 2 15% from 2027-01-01
    not_dutiable: {HR-20140: "coaxial 8536.69.4010 is excluded by the notice", HR-20115: "8536.90 is not a listed code", mexico_lines: [HR-20133, HR-20134, HR-20135]}
  must_mention: ["DDP", "2026-11-30", "Tijuana", ["2027-01-01", "1 January 2027", "calendar 2027", "2027 pricing"]]
  conditions_labelled:
    - ddp: "BCX is importer of record and invoices the duty as a separate line at cost: Halden pays it through the invoice, not at entry; labelled pass-through"
    - tijuana: "charging contacts (HR-20136, HR-20137) move to Tijuana, targeted Q2 2027: the duty ends for them only once that is qualified"
    - validity: "quote valid until 2026-11-30"
  alias:
    records: [SUP-0016, V10045, SUP-0061]     # Baycrest Connectors (two spellings) and BCX Interconnect, one company renamed after the Ardenmoor acquisition
    action: {type: supplier_alias, state: proposed, merge_into: SUP-0016}   # proposed for a person to approve, never applied
    evidence: ["email: same tax id, bank account and remit-to; Net 30 and DDP Reno unchanged", "news N-011: Baycrest completes rebrand to BCX Interconnect"]
  trust:
    sender_domain: "bcxinterconnect.example differs from the Baycrest address on SUP-0016 but equals SUP-0061's: noted as the rename, not raised as a lookalike"
  actions:
    allowed_types: [supplier_alias, supplier_request, note, assign]
    forbidden_types: [po_change, payment_change]
    all_state: proposed
  ledger: {executed_count: 0}
reason: "A rename plus a quote in per-thousand prices with origin by line: the traps are reading 240.58 as each, charging duty on the excluded coax and the unlisted terminals, and treating a legitimate rename as a fraud flag."
source: "data/quotes/2026-09-02_Baycrest_Connectors_is_now_BCX_Interconnect...eml and pdf/BCX-Q-2609_BCX_Interconnect_quotation.pdf (origin by line, notes 1-4); data/suppliers.csv SUP-0016, V10045, SUP-0061; data/external/supplier_news.json N-011; data/external/tariff_notice.md (exclusions; tranche 2); data/parts.csv HR-20103..HR-20140"
